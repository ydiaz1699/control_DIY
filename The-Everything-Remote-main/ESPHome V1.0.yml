esphome:
  name: everything-remote
  friendly_name: Everything Remote
  min_version: 2024.11.0
  name_add_mac_suffix: false

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
# logger:

# Enable Home Assistant API
api:

# Allow Over-The-Air updates
ota:
- platform: esphome

wifi:
  ssid: my_wifi
  password: my_password
  output_power: 10db
  fast_connect: True
  power_save_mode: LIGHT

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode:
       input: true
       pullup: true
      inverted: true
    name: "Power"
    id: power
    internal: true
    on_multi_click:
      - timing:
          - ON for at most 350ms
        then:
          - homeassistant.event:
              event: esphome.remote_button_pressed
              data:
                button: power
                type: single
      - timing:
          - ON for at least 500ms
        then:
          - homeassistant.event:
              event: esphome.remote_button_pressed
              data:
                button: power
                type: long
