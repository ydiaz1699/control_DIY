; PlatformIO Project Configuration — Control A "Mando Portátil"
; Fusión de OMOTE + homeThing + OLED Remote + The-Everything-Remote
;
; Hardware: ESP32-S3, TFT 2.8" 320x240 tactil, IR TX/RX, BLE, WiFi, IMU, Fuel Gauge

[platformio]
default_envs = esp32s3

[env]
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    lvgl/lvgl@^9.1.0
    lovyan03/LovyanGFX@^1.2.0
    crankyoldgit/IRremoteESP8266@^2.8.6
    knolleary/PubSubClient@^2.8
    h2zero/NimBLE-Arduino@^1.4.3
    sparkfun/SparkFun LIS3DH Arduino Library@^1.0.3
    sparkfun/SparkFun MAX1704x Fuel Gauge Arduino Library@^1.0.4
    bblanchon/ArduinoJson@^7.0.0
    adafruit/Adafruit TCA8418@^1.0.2
build_flags =
    ; --- LVGL Configuration ---
    -D LV_CONF_SKIP=1
    -D LV_USE_LOG=1
    -D LV_LOG_PRINTF=1
    -D LV_LOG_LEVEL=LV_LOG_LEVEL_WARN
    -D LV_FONT_MONTSERRAT_10=1
    -D LV_FONT_MONTSERRAT_12=1
    -D LV_FONT_MONTSERRAT_14=1
    -D LV_FONT_MONTSERRAT_16=1
    -D LV_FONT_MONTSERRAT_20=1
    -D LV_FONT_MONTSERRAT_24=1
    -D LV_FONT_MONTSERRAT_28=1
    -D LV_THEME_DEFAULT_DARK=1
    -D LV_BUILD_EXAMPLES=0
    -D LV_USE_DEMO_WIDGETS=0
    ; --- Screen ---
    -D SCR_WIDTH=240
    -D SCR_HEIGHT=320
    ; --- Features ---
    -D ENABLE_WIFI=1
    -D ENABLE_MQTT=1
    -D ENABLE_BLE_KEYBOARD=1
    -D ENABLE_IR=1
    -D ENABLE_HAPTIC=1
    -D ENABLE_ESPNOW=1
    -D ENABLE_NFC=0
    -D ENABLE_VOICE=0
    ; --- Hardware ---
    -D HARDWARE_REV=5
    -I src
    -I src/hal
    -I src/gui
    -I src/comms
    -I src/app

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.extra_flags = -DBOARD_HAS_PSRAM
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = huge_app.csv
build_flags =
    ${env.build_flags}
    -D LV_MEM_CUSTOM=0
    -D LV_MEM_SIZE="(128U * 1024U)"
    '-D LV_MEM_POOL_INCLUDE=<esp32-hal-psram.h>'
    -D LV_MEM_POOL_ALLOC="ps_malloc"
    -D CONFIG_BT_NIMBLE_MAX_BONDS=3
    -D CONFIG_BT_NIMBLE_MAX_CCCDS=12
build_src_filter =
    +<*>

[env:esp32_rev4]
platform = espressif32
board = esp32dev
board_build.f_flash = 80000000L
board_build.partitions = huge_app.csv
build_flags =
    ${env.build_flags}
    -D LV_MEM_CUSTOM=0
    -D LV_MEM_SIZE="(48U * 1024U)"
    -D HARDWARE_REV=4
    -D CONFIG_BT_NIMBLE_MAX_BONDS=3
    -D CONFIG_BT_NIMBLE_MAX_CCCDS=12
build_src_filter =
    +<*>
