; ControlA - Mando Portátil Universal
; Basado en hardware OMOTE Rev5 (ESP32-S3)
; Firmware fusionado: OMOTE + homeThing + OLED Remote + Everything Remote

[platformio]
default_envs = esp32s3_omote

[env]
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    lvgl/lvgl@^8.3.11
    lovyan03/LovyanGFX@^1.2.0
    sparkfun/SparkFun LIS3DH Arduino Library@^1.0.3
    crankyoldgit/IRremoteESP8266@^2.8.6
    knolleary/PubSubClient@^2.8
    h2zero/NimBLE-Arduino@^1.4.3
    sparkfun/SparkFun MAX1704x Fuel Gauge Arduino Library@^1.0.4
    adafruit/Adafruit TCA8418@^1.0.2
    bblanchon/ArduinoJson@^7.0.0

build_flags =
    ; --- LVGL ---
    -D LV_CONF_SKIP=1
    -D LV_TICK_CUSTOM=1
    -D LV_FONT_MONTSERRAT_10=1
    -D LV_FONT_MONTSERRAT_12=1
    -D LV_FONT_MONTSERRAT_14=1
    -D LV_FONT_MONTSERRAT_16=1
    -D LV_FONT_MONTSERRAT_20=1
    -D LV_FONT_MONTSERRAT_24=1
    -D LV_FONT_MONTSERRAT_28=1
    -D LV_THEME_DEFAULT_DARK=1
    -D LV_BUILD_EXAMPLES=0
    -D LV_USE_LOG=1
    -D LV_LOG_PRINTF=1
    -D LV_LOG_LEVEL=LV_LOG_LEVEL_WARN
    -D LV_MEM_CUSTOM=0
    -D LV_MEM_SIZE="(128U * 1024U)"
    '-D LV_MEM_POOL_INCLUDE=<esp32-hal-psram.h>'
    -D LV_MEM_POOL_ALLOC="ps_malloc"
    ; --- Display ---
    -D SCR_WIDTH=240
    -D SCR_HEIGHT=320
    -D SPI_FREQUENCY=40000000
    ; --- Features ---
    -D ENABLE_WIFI=1
    -D ENABLE_MQTT=1
    -D ENABLE_BLE=1
    -D ENABLE_IR=1
    -D ENABLE_IMU=1
    -D ENABLE_HAPTIC=1
    -D ENABLE_NFC=0
    -D ENABLE_VOICE=0
    -D ENABLE_SYNC=1
    ; --- BLE ---
    -D CONFIG_BT_NIMBLE_MAX_BONDS=3
    -D CONFIG_BT_NIMBLE_MAX_CCCDS=12

[env:esp32s3_omote]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.extra_flags = -DBOARD_HAS_PSRAM
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
lib_deps = ${env.lib_deps}
build_flags =
    ${env.build_flags}
    -D OMOTE_HARDWARE_REV=5
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32_omote_rev4]
platform = espressif32
board = esp32dev
board_build.f_flash = 80000000L
board_build.partitions = huge_app.csv
lib_deps =
    ${env.lib_deps}
build_unflags =
    -D LV_MEM_SIZE="(128U * 1024U)"
    '-D LV_MEM_POOL_INCLUDE=<esp32-hal-psram.h>'
    -D LV_MEM_POOL_ALLOC="ps_malloc"
build_flags =
    ${env.build_flags}
    -D OMOTE_HARDWARE_REV=4
    -D LV_MEM_SIZE="(32U * 1024U)"
