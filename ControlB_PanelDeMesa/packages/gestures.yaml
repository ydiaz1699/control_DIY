# ═══════════════════════════════════════════════════════════
# Gesture Engine — Advanced touch interactions
# ═══════════════════════════════════════════════════════════
# 
# INNOVATION: Multi-touch gesture recognition
# - Swipe from edge: reveal widget panel
# - Swipe left/right: navigate dashboard pages
# - Long press: show context menu / scene picker
# - Two-finger swipe down: dim display
# - Double-tap: toggle widget overlay

globals:
  - id: gesture_start_x
    type: int16_t
    initial_value: '0'
  - id: gesture_start_y
    type: int16_t
    initial_value: '0'
  - id: gesture_start_time
    type: unsigned long
    initial_value: '0'
  - id: gesture_active
    type: bool
    initial_value: 'false'
  - id: last_tap_time
    type: unsigned long
    initial_value: '0'

